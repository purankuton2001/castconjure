name: Feature request
description: An adapter, a backend, a persona feature, a fandom feature
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes: { label: The idea, description: "What should the persona (or the streamer) be able to do?" }
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: Why it matters for a live stream }
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This does not involve real people's faces, voices or existing characters/IP
          required: true
